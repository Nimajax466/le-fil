# Le Fil : liste des sources
#
# Pour chaque source :
#   nom        nom affiché
#   site       page d'accueil (sert à retrouver le flux tout seul si l'adresse change)
#   flux       adresse du flux RSS ou Atom
#   categorie  "tech" ou "general"
#   max_par_heure (facultatif) : plafond d'articles retenus par heure pour cette source.
#
# Aucun tri, aucun score : la liste est chronologique. Le seul réglage du ratio
# tech / généraliste est max_par_heure, posé sur les sites généralistes qui publient
# beaucoup plus que les autres. Monte-le ou descends-le à ton goût.
#
# Après modification et envoi sur GitHub, un relevé se lance aussitôt avec la nouvelle liste.

[reglages]
age_max_heures = 48     # les articles plus anciens sont ignorés
historique = 300        # articles publiés (les plus récents)
images_par_releve = 30  # articles sans image dont on va chercher l'image sur la page


